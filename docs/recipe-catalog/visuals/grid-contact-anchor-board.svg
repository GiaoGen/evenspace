<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1740" role="img" aria-labelledby="title desc">
  <title id="title">Grid Contact three selected anchors and eighteen content stress states</title>
  <desc id="desc">Twin Register, Twelve-up Ledger and Cross Register are each shown in six states including ratio, count, note and focus stress.</desc>
  <defs>
    <style>
      .bg{fill:#f2f2f0}.paper{fill:#fff;stroke:#202020;stroke-width:1.2}.gutter{stroke:#111;stroke-width:.8}.safe{fill:none;stroke:#aaa;stroke-width:.55;stroke-dasharray:2 2}.h1{font:700 24px Arial,sans-serif;fill:#111}.h2{font:700 18px Arial,sans-serif;fill:#111}.state{font:700 11px Arial,sans-serif;fill:#222;letter-spacing:.6px}.meta{font:11px Arial,sans-serif;fill:#555}.tiny{font:8px Arial,sans-serif;fill:#555}.num{font:700 6px Arial,sans-serif;fill:#111}.rule{stroke:#777;stroke-width:.65}.bind{fill:none;stroke:#777;stroke-width:.65;stroke-dasharray:2 2}.reject{fill:#ddd;stroke:#555;stroke-width:.8}.rejectText{font:700 8px Arial,sans-serif;fill:#333}.divider{stroke:#bbb;stroke-width:1}.dark{fill:#222}.white{fill:#fff}
    </style>
    <symbol id="p1" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid slice"><rect width="100" height="70" fill="#ccc"/><path d="M0 53L23 34L45 48L72 19L100 45V70H0Z" fill="#747474"/><circle cx="72" cy="18" r="7" fill="#eee"/><rect x="11" y="43" width="15" height="27" fill="#444"/></symbol>
    <symbol id="p2" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid slice"><rect width="100" height="70" fill="#aaa"/><rect y="45" width="100" height="25" fill="#666"/><circle cx="43" cy="29" r="12" fill="#eee"/><rect x="36" y="40" width="14" height="30" fill="#333"/><path d="M67 10H93V52H67Z" fill="#ddd"/></symbol>
    <symbol id="p3" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid slice"><rect width="100" height="70" fill="#d8d8d6"/><path d="M0 43Q28 27 56 42T100 38V70H0Z" fill="#898989"/><path d="M58 12L72 46H44Z" fill="#4c4c4c"/><circle cx="58" cy="12" r="6" fill="#777"/></symbol>
    <symbol id="p4" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid slice"><rect width="100" height="70" fill="#bcbcbc"/><path d="M0 18L100 49V70H0Z" fill="#565656"/><rect x="18" y="8" width="22" height="45" fill="#e7e7e5"/><circle cx="71" cy="35" r="12" fill="#888"/></symbol>
    <symbol id="p5" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid slice"><rect width="100" height="70" fill="#d2d2d0"/><rect y="48" width="100" height="22" fill="#888"/><path d="M18 48V21H41V48M56 48V8H83V48" fill="#505050"/><rect x="62" y="14" width="8" height="12" fill="#eee"/></symbol>
    <symbol id="p6" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid slice"><rect width="100" height="70" fill="#bababa"/><path d="M0 57L35 24L53 38L78 17L100 40V70H0Z" fill="#626262"/><circle cx="31" cy="23" r="8" fill="#e7e7e5"/></symbol>
    <g id="twin-base"><rect class="paper" width="120" height="160"/><rect class="safe" x="8" y="9" width="104" height="141"/><text class="num" x="8" y="17">A</text><use href="#p1" x="8" y="20" width="104" height="54"/><text class="num" x="8" y="89">B</text><use href="#p2" x="8" y="93" width="104" height="54"/></g>
    <g id="ledger-base"><rect class="paper" width="120" height="160"/><rect class="safe" x="7" y="9" width="106" height="141"/>
      <use href="#p1" x="7" y="20" width="32" height="25"/><use href="#p2" x="44" y="20" width="32" height="25"/><use href="#p3" x="81" y="20" width="32" height="25"/>
      <use href="#p4" x="7" y="50" width="32" height="25"/><use href="#p5" x="44" y="50" width="32" height="25"/><use href="#p6" x="81" y="50" width="32" height="25"/>
      <use href="#p3" x="7" y="86" width="32" height="25"/><use href="#p4" x="44" y="86" width="32" height="25"/><use href="#p2" x="81" y="86" width="32" height="25"/>
      <use href="#p5" x="7" y="116" width="32" height="25"/><use href="#p1" x="44" y="116" width="32" height="25"/><use href="#p4" x="81" y="116" width="32" height="25"/><text class="num" x="104" y="15">08</text>
    </g>
    <g id="cross-base"><rect class="paper" width="240" height="160"/><line class="gutter" x1="120" y1="0" x2="120" y2="160"/><rect class="safe" x="7" y="9" width="226" height="141"/>
      <use href="#p1" x="8" y="22" width="47" height="50"/><use href="#p2" x="65" y="22" width="47" height="50"/><use href="#p3" x="8" y="88" width="47" height="50"/><use href="#p4" x="65" y="88" width="47" height="50"/>
      <text class="state" x="141" y="28">INDEX</text><text class="num" x="141" y="51">01</text><line class="rule" x1="154" y1="48" x2="218" y2="48"/>
      <text class="num" x="141" y="71">02</text><line class="rule" x1="154" y1="68" x2="224" y2="68"/>
      <text class="num" x="141" y="91">03</text><line class="rule" x1="154" y1="88" x2="214" y2="88"/>
      <text class="num" x="141" y="111">04</text><line class="rule" x1="154" y1="108" x2="226" y2="108"/>
    </g>
  </defs>
  <rect class="bg" width="1660" height="1740"/>
  <text class="h1" x="60" y="42">GRID / CONTACT — SELECTED ANCHOR STRESS BOARD</text>
  <text class="meta" x="60" y="65">18 STATES · PAGE 120×160 / SPREAD 240×160 AT ONE SCALE · ALL PHOTO FRAMES USE COVER · GRAYSCALE ORIGINAL VECTOR PLACEHOLDERS</text>

  <!-- Twin Register row -->
  <g transform="translate(60 105)">
    <text class="h2" x="0" y="0">01 · TWIN REGISTER</text><text class="meta" x="225" y="0">ROLE 05 · grid-contact-twin-register-v1 · PAGE · EXACTLY 2 · NOTE NONE</text>
    <g transform="translate(0 35)"><text class="state" y="-10">IDEAL CONTENT</text><use href="#twin-base"/></g>
    <g transform="translate(245 35)"><text class="state" y="-10">LANDSCAPE PRESSURE</text><rect class="paper" width="120" height="160"/><rect class="safe" x="8" y="9" width="104" height="141"/><text class="num" x="8" y="17">A</text><use href="#p6" x="8" y="20" width="104" height="54"/><text class="num" x="8" y="89">B</text><use href="#p4" x="8" y="93" width="104" height="54"/></g>
    <g transform="translate(490 35)"><text class="state" y="-10">PORTRAIT / SQUARE</text><rect class="paper" width="120" height="160"/><rect class="safe" x="8" y="9" width="104" height="141"/><text class="num" x="8" y="17">A</text><use href="#p2" x="8" y="20" width="104" height="54"/><text class="num" x="8" y="89">B</text><use href="#p5" x="8" y="93" width="104" height="54"/></g>
    <g transform="translate(735 35)"><text class="state" y="-10">MIN = 2 · NO EMPTY</text><use href="#twin-base"/><text class="tiny" x="0" y="176">1 photo → needs-content</text></g>
    <g transform="translate(980 35)"><text class="state" y="-10">MAX = 2 · THIRD REJECT</text><use href="#twin-base"/><rect class="reject" x="128" y="64" width="47" height="36"/><text class="rejectText" x="139" y="85">#03</text><path d="M130 66L173 98M173 66L130 98" stroke="#444"/></g>
    <g transform="translate(1270 35)"><text class="state" y="-10">PAGE FOCUS · NOTE N/A</text><use href="#twin-base"/><text class="tiny" x="0" y="176">same geometry · no reflow</text></g>
    <text class="meta" x="0" y="232">ADVANTAGE  Equal 29.24% modules make comparison explicit without hero hierarchy.</text>
    <text class="meta" x="0" y="251">RISK  Extreme portraits crop hard; fixed breathing zone must read as register spacing, not Quiet pause.</text>
  </g>
  <line class="divider" x1="60" y1="405" x2="1600" y2="405"/>

  <!-- Twelve-up row -->
  <g transform="translate(60 455)">
    <text class="h2" x="0" y="0">02 · TWELVE-UP LEDGER</text><text class="meta" x="270" y="0">ROLE 02 · grid-contact-twelve-up-ledger-v1 · PAGE · EXACTLY 12 · NOTE NONE</text>
    <g transform="translate(0 35)"><text class="state" y="-10">IDEAL 12-FRAME ROLL</text><use href="#ledger-base"/></g>
    <g transform="translate(245 35)"><text class="state" y="-10">LANDSCAPE BATCH</text><use href="#ledger-base"/></g>
    <g transform="translate(490 35)"><text class="state" y="-10">PORTRAIT / SQUARE MIX</text><rect class="paper" width="120" height="160"/><rect class="safe" x="7" y="9" width="106" height="141"/>
      <use href="#p2" x="7" y="20" width="32" height="25"/><use href="#p5" x="44" y="20" width="32" height="25"/><use href="#p3" x="81" y="20" width="32" height="25"/><use href="#p1" x="7" y="50" width="32" height="25"/><use href="#p4" x="44" y="50" width="32" height="25"/><use href="#p6" x="81" y="50" width="32" height="25"/><use href="#p5" x="7" y="86" width="32" height="25"/><use href="#p2" x="44" y="86" width="32" height="25"/><use href="#p1" x="81" y="86" width="32" height="25"/><use href="#p3" x="7" y="116" width="32" height="25"/><use href="#p6" x="44" y="116" width="32" height="25"/><use href="#p4" x="81" y="116" width="32" height="25"/><text class="num" x="104" y="15">08</text>
    </g>
    <g transform="translate(735 35)"><text class="state" y="-10">MIN = MAX = 12</text><use href="#ledger-base"/><text class="tiny" x="0" y="176">11 → needs-content; no blank cell</text></g>
    <g transform="translate(980 35)"><text class="state" y="-10">PAGE FOCUS · NOTE N/A</text><use href="#ledger-base"/><text class="tiny" x="0" y="176">fixed grid · folio only</text></g>
    <g transform="translate(1270 35)"><text class="state" y="-10">MAX + OVERFLOW REJECT</text><use href="#ledger-base"/><rect class="reject" x="128" y="64" width="47" height="36"/><text class="rejectText" x="137" y="85">#13</text><path d="M130 66L173 98M173 66L130 98" stroke="#444"/><rect x="0" y="181" width="32" height="25" fill="#fff" stroke="#111"/><use href="#p1" x="0" y="181" width="32" height="25"/><text class="tiny" x="40" y="191">MIN MODULE</text><text class="tiny" x="40" y="202">4.59% PAGE</text></g>
    <text class="meta" x="0" y="242">ADVANTAGE  Twelve equal 4.59% modules, stable row order and a visible 6+6 group gap make the roll scannable.</text>
    <text class="meta" x="0" y="261">RISK  Small-screen subject recognition is the hard Gate; exact-12 content demand may reduce everyday use.</text>
  </g>
  <line class="divider" x1="60" y1="770" x2="1600" y2="770"/>

  <!-- Cross Register row -->
  <g transform="translate(60 820)">
    <text class="h2" x="0" y="0">03 · CROSS REGISTER</text><text class="meta" x="245" y="0">ROLE 11 · grid-contact-cross-register-v1 · SPREAD · EXACTLY 4 · REQUIRED PHOTO NOTE INDEX</text>
    <g transform="translate(0 35)"><text class="state" y="-10">IDEAL · MIN = MAX = 4</text><use href="#cross-base"/><path class="bind" d="M141 48C125 48 121 47 112 47M141 68C125 68 121 57 112 57M141 88C125 88 121 108 112 108M141 108C125 108 121 122 112 122"/><text class="tiny" x="0" y="176">full spread · 4 legal cross-page-pairs</text></g>
    <g transform="translate(280 35)"><text class="state" y="-10">LANDSCAPE PRESSURE</text><use href="#cross-base"/></g>
    <g transform="translate(560 35)"><text class="state" y="-10">PORTRAIT / SQUARE</text><rect class="paper" width="240" height="160"/><line class="gutter" x1="120" y1="0" x2="120" y2="160"/><rect class="safe" x="7" y="9" width="226" height="141"/>
      <use href="#p2" x="8" y="22" width="47" height="50"/><use href="#p5" x="65" y="22" width="47" height="50"/><use href="#p3" x="8" y="88" width="47" height="50"/><use href="#p1" x="65" y="88" width="47" height="50"/>
      <text class="state" x="141" y="28">INDEX</text><text class="num" x="141" y="51">01</text><line class="rule" x1="154" y1="48" x2="218" y2="48"/><text class="num" x="141" y="71">02</text><line class="rule" x1="154" y1="68" x2="224" y2="68"/><text class="num" x="141" y="91">03</text><line class="rule" x1="154" y1="88" x2="214" y2="88"/><text class="num" x="141" y="111">04</text><line class="rule" x1="154" y1="108" x2="226" y2="108"/>
    </g>
    <g transform="translate(840 35)"><text class="state" y="-10">NOTE MISSING → REJECT</text><rect class="paper" width="240" height="160"/><line class="gutter" x1="120" y1="0" x2="120" y2="160"/><use href="#p1" x="8" y="22" width="47" height="50"/><use href="#p2" x="65" y="22" width="47" height="50"/><use href="#p3" x="8" y="88" width="47" height="50"/><use href="#p4" x="65" y="88" width="47" height="50"/><rect class="reject" x="141" y="45" width="78" height="55"/><text class="rejectText" x="151" y="67">REQUIRED INDEX</text><text class="rejectText" x="154" y="82">NEEDS CONTENT</text></g>
    <g transform="translate(1120 35)"><text class="state" y="-10">LONGEST LEGAL NOTES</text><rect class="paper" width="240" height="160"/><line class="gutter" x1="120" y1="0" x2="120" y2="160"/><use href="#p1" x="8" y="22" width="47" height="50"/><use href="#p2" x="65" y="22" width="47" height="50"/><use href="#p3" x="8" y="88" width="47" height="50"/><use href="#p4" x="65" y="88" width="47" height="50"/><text class="state" x="141" y="28">INDEX</text>
      <text class="num" x="141" y="50">01</text><line class="rule" x1="154" y1="47" x2="228" y2="47"/><text class="num" x="141" y="70">02</text><line class="rule" x1="154" y1="67" x2="228" y2="67"/><text class="num" x="141" y="90">03</text><line class="rule" x1="154" y1="87" x2="228" y2="87"/><text class="num" x="141" y="110">04</text><line class="rule" x1="154" y1="107" x2="228" y2="107"/><text class="tiny" x="141" y="128">18 chars / 1 line each</text>
    </g>
    <g transform="translate(1400 35)"><text class="state" y="-10">SINGLE-PAGE FOCUS</text><rect class="paper" width="120" height="160"/><use href="#p1" x="8" y="22" width="47" height="50"/><use href="#p2" x="65" y="22" width="47" height="50"/><use href="#p3" x="8" y="88" width="47" height="50"/><use href="#p4" x="65" y="88" width="47" height="50"/><text class="tiny" x="0" y="174">LEFT: complete matrix</text><rect class="paper" x="130" width="120" height="160"/><text class="state" x="151" y="28">INDEX</text><text class="num" x="151" y="51">01</text><line class="rule" x1="164" y1="48" x2="228" y2="48"/><text class="num" x="151" y="71">02</text><line class="rule" x1="164" y1="68" x2="234" y2="68"/><text class="num" x="151" y="91">03</text><line class="rule" x1="164" y1="88" x2="224" y2="88"/><text class="num" x="151" y="111">04</text><line class="rule" x1="164" y1="108" x2="236" y2="108"/><text class="tiny" x="130" y="174">RIGHT: readable index duty</text></g>
    <text class="meta" x="0" y="242">ADVANTAGE  Required photo-bound index makes the spread legal and turns the opposite page into a retrieval surface.</text>
    <text class="meta" x="0" y="261">RISK  Exact four notes must survive real typography; right-page focus must not feel like empty Editorial copy.</text>
  </g>

  <line class="divider" x1="60" y1="1155" x2="1600" y2="1155"/>
  <text class="h2" x="60" y="1200">CROSS-FAMILY BOUNDARY CHECK</text>
  <text class="meta" x="60" y="1230">TWIN REGISTER ≠ QUIET SCALE ECHO: equal modules + A/B register, not large/small echo.</text>
  <text class="meta" x="60" y="1252">TWELVE-UP LEDGER ≠ EDITORIAL: no hero, title or evidence hierarchy; the row scan is the first language.</text>
  <text class="meta" x="60" y="1274">CROSS REGISTER ≠ QUIET HORIZON / EDITORIAL ACROSS THE RECORD: no cross-gutter hero; four photo-bound index entries create the spread.</text>
  <text class="h2" x="60" y="1325">PAIRWISE DIFFERENCE</text>
  <text class="meta" x="60" y="1355">Twin ↔ Twelve-up = 5 · Twin ↔ Cross = 9 · Twelve-up ↔ Cross = 9 · threshold ≥ 4 passed.</text>
  <text class="h2" x="60" y="1410">VISUAL DECISIONS FOR USER</text>
  <text class="meta" x="60" y="1440">1  Does Twin Register read as strict archive rather than Quiet pause?</text>
  <text class="meta" x="60" y="1462">2  Is Twelve-up’s 4.59% module legible at real Reader size?</text>
  <text class="meta" x="60" y="1484">3  Do Cross Register’s longest notes and both single-page focus views remain understandable?</text>
  <rect class="dark" x="60" y="1530" width="1540" height="78"/>
  <text class="state white" x="82" y="1561">AUDIT LAYER ONLY</text>
  <text class="meta white" x="82" y="1585">Safe-area guides, binding lines, rejection marks and state labels are review annotations—not Renderer assets. Optional content never causes reflow.</text>
</svg>
