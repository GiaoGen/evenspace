<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1840" role="img" aria-labelledby="title desc">
  <title id="title">Chromatic selected anchor Color-on Color-off and content stress board</title>
  <desc id="desc">Entry Field, Four Beat and Cross-field Note are shown in eighteen principal states covering color, grayscale, photo ratio, busy photography, note, content count, contrast, focus and spread evidence.</desc>
  <defs>
    <style>
      .bg{fill:#eeeeeb}.paper{fill:#F4F0E8;stroke:#17191C;stroke-width:1}.a1{fill:#164B8C}.a2{fill:#A83D2B}.a3{fill:#D49A18}.g1{fill:#505050}.g2{fill:#666}.g3{fill:#A6A6A6}.ink{fill:#17191C}.inv{fill:#fff}.mat{fill:#D7D3CA}.safe{fill:none;stroke:#8b8b8b;stroke-width:.5;stroke-dasharray:2 2}.gutter{stroke:#17191C;stroke-width:.7}.h1{font:700 24px Arial,sans-serif;fill:#17191C}.h2{font:700 18px Arial,sans-serif;fill:#17191C}.state{font:700 9px Arial,sans-serif;fill:#17191C;letter-spacing:.45px}.meta{font:10px Arial,sans-serif;fill:#55585D}.tiny{font:7.5px Arial,sans-serif;fill:#55585D}.idx{font:700 5px Arial,sans-serif;letter-spacing:.45px}.noteText{font:6px Arial,sans-serif}.divider{stroke:#b8b8b4;stroke-width:1}.reject{fill:#ddd;stroke:#55585D;stroke-width:.7}.rejectText{font:700 7px Arial,sans-serif;fill:#17191C}.bind{fill:none;stroke:#55585D;stroke-width:.6;stroke-dasharray:2 2}.dark{fill:#17191C}.white{fill:#fff}
    </style>
    <symbol id="land" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid slice"><rect width="100" height="70" fill="#c7c7c5"/><path d="M0 52L23 35L48 49L72 20L100 43V70H0Z" fill="#707070"/><circle cx="72" cy="18" r="7" fill="#eee"/><rect x="15" y="41" width="14" height="29" fill="#383838"/></symbol>
    <symbol id="portrait" viewBox="0 0 70 100" preserveAspectRatio="xMidYMid slice"><rect width="70" height="100" fill="#bababa"/><path d="M0 75L22 52L39 65L70 36V100H0Z" fill="#666"/><circle cx="43" cy="30" r="10" fill="#eee"/><rect x="34" y="42" width="18" height="42" fill="#333"/><path d="M13 12V90" stroke="#ddd" stroke-width="6"/></symbol>
    <symbol id="square" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#d0d0ce"/><circle cx="63" cy="38" r="19" fill="#eee"/><rect x="48" y="56" width="31" height="44" fill="#4b4b4b"/><path d="M0 78L34 55L47 76V100H0Z" fill="#777"/></symbol>
    <symbol id="busy" viewBox="0 0 100 70" preserveAspectRatio="xMidYMid slice"><rect width="100" height="70" fill="#D49A18"/><path d="M0 50L20 24L43 54L62 16L82 48L100 27V70H0Z" fill="#164B8C"/><circle cx="31" cy="29" r="13" fill="#A83D2B"/><rect x="68" y="17" width="20" height="40" fill="#F4F0E8"/><path d="M4 15H36M52 61H96" stroke="#17191C" stroke-width="5"/></symbol>
    <g id="entry-on"><rect class="paper" width="90" height="120"/><rect class="a1" x="4.5" y="7.2" width="81" height="21.6"/><use href="#land" x="4.5" y="36" width="81" height="74.4"/></g>
    <g id="entry-off"><rect class="paper" width="90" height="120"/><rect class="g1" x="4.5" y="7.2" width="81" height="21.6"/><use href="#land" x="4.5" y="36" width="81" height="74.4"/></g>
    <g id="beat-on"><rect class="paper" width="90" height="120"/><use href="#portrait" x="4.5" y="26.4" width="18.9" height="33.6"/><use href="#square" x="25.2" y="26.4" width="18.9" height="33.6"/><use href="#land" x="45.9" y="26.4" width="18.9" height="33.6"/><use href="#busy" x="66.6" y="26.4" width="18.9" height="33.6"/><rect class="a1" x="4.5" y="67.2" width="18.9" height="19.2"/><rect class="a2" x="25.2" y="67.2" width="18.9" height="19.2"/><rect class="a3" x="45.9" y="67.2" width="18.9" height="19.2"/><rect class="a1" x="66.6" y="67.2" width="18.9" height="19.2"/><text class="idx inv" x="7.2" y="78">01</text><text class="idx inv" x="27.9" y="78">02</text><text class="idx ink" x="48.6" y="78">03</text><text class="idx inv" x="69.3" y="78">04</text></g>
    <g id="beat-off"><rect class="paper" width="90" height="120"/><use href="#portrait" x="4.5" y="26.4" width="18.9" height="33.6"/><use href="#square" x="25.2" y="26.4" width="18.9" height="33.6"/><use href="#land" x="45.9" y="26.4" width="18.9" height="33.6"/><use href="#busy" x="66.6" y="26.4" width="18.9" height="33.6"/><rect class="g1" x="4.5" y="67.2" width="18.9" height="19.2"/><rect class="g2" x="25.2" y="67.2" width="18.9" height="19.2"/><rect class="g3" x="45.9" y="67.2" width="18.9" height="19.2"/><rect class="g1" x="66.6" y="67.2" width="18.9" height="19.2"/><text class="idx inv" x="7.2" y="78">01</text><text class="idx inv" x="27.9" y="78">02</text><text class="idx ink" x="48.6" y="78">03</text><text class="idx inv" x="69.3" y="78">04</text></g>
    <g id="cross-on"><rect class="paper" width="180" height="120"/><line class="gutter" x1="90" y1="0" x2="90" y2="120"/><use href="#land" x="5.4" y="12" width="73.8" height="81.6"/><rect class="a3" x="5.4" y="98.4" width="73.8" height="14.4"/><text class="idx ink" x="9" y="107">IMAGE 01</text><rect class="a1" x="97.2" y="12" width="75.6" height="86.4"/><text class="idx inv" x="104" y="27">FIELD NOTE</text><text class="noteText inv" x="104" y="44">A required observation</text><text class="noteText inv" x="104" y="53">travels with this image.</text><path class="bind" d="M79 58C87 58 90 58 97 58"/></g>
    <g id="cross-off"><rect class="paper" width="180" height="120"/><line class="gutter" x1="90" y1="0" x2="90" y2="120"/><use href="#land" x="5.4" y="12" width="73.8" height="81.6"/><rect class="g3" x="5.4" y="98.4" width="73.8" height="14.4"/><text class="idx ink" x="9" y="107">IMAGE 01</text><rect class="g1" x="97.2" y="12" width="75.6" height="86.4"/><text class="idx inv" x="104" y="27">FIELD NOTE</text><text class="noteText inv" x="104" y="44">A required observation</text><text class="noteText inv" x="104" y="53">travels with this image.</text><path class="bind" d="M79 58C87 58 90 58 97 58"/></g>
  </defs>
  <rect class="bg" width="1660" height="1840"/>
  <text class="h1" x="55" y="40">CHROMATIC — SELECTED ANCHOR COLOR / CONTENT STRESS BOARD</text>
  <text class="meta" x="55" y="64">18 PRINCIPAL STATES · PAGE 90×120 / SPREAD 180×120 · SOLID OPAQUE FIELDS · ALL PHOTOS COVER · COLOR-OFF PRESERVES LUMINANCE TOPOLOGY</text>

  <!-- Entry Field -->
  <g transform="translate(55 112)">
    <text class="h2" x="0" y="0">01 · ENTRY FIELD</text><text class="meta" x="178" y="0">chromatic-entry-field-v1 · PAGE · SINGLE-ACCENT · 1 PHOTO · NO TEXT / NOTE</text>
    <g transform="translate(0 38)"><text class="state" y="-10">IDEAL COLOR-ON</text><use href="#entry-on"/><text class="tiny" x="0" y="137">A1 entry 16.2% · photo 55.8%</text></g>
    <g transform="translate(245 38)"><text class="state" y="-10">EXACT COLOR-OFF</text><use href="#entry-off"/><text class="tiny" x="0" y="137">field retained as #505050</text></g>
    <g transform="translate(490 38)"><text class="state" y="-10">LANDSCAPE / HIGH-COLOR</text><rect class="paper" width="90" height="120"/><rect class="a1" x="4.5" y="7.2" width="81" height="21.6"/><use href="#busy" x="4.5" y="36" width="81" height="74.4"/><text class="tiny" x="0" y="137">paper gap prevents hue fusion</text></g>
    <g transform="translate(735 38)"><text class="state" y="-10">PORTRAIT / ACTIVE-EDGE</text><rect class="paper" width="90" height="120"/><rect class="a1" x="4.5" y="7.2" width="81" height="21.6"/><use href="#portrait" x="4.5" y="36" width="81" height="74.4"/><rect class="safe" x="58" y="48" width="16" height="25"/><text class="tiny" x="0" y="137">focus repairs one-sided subject only</text></g>
    <g transform="translate(980 38)"><text class="state" y="-10">MIN = MAX 1 · #02 OVERFLOW</text><use href="#entry-on"/><rect class="reject" x="101" y="48" width="38" height="28"/><text class="rejectText" x="111" y="65">#02</text><path d="M103 50L137 74M137 50L103 74" stroke="#55585D"/><text class="tiny" x="0" y="137">second photo remains unplaced</text></g>
    <g transform="translate(1260 38)"><text class="state" y="-10">NO NOTE / FOCUS / NO TEXT</text><use href="#entry-on"/><rect class="safe" x="4.5" y="36" width="81" height="74.4"/><text class="tiny" x="0" y="137">short/long Note N/A · fixed geometry</text></g>
    <text class="meta" x="0" y="218">COLOR-ON  The field owns entry but remains smaller than the photograph. COLOR-OFF  Threshold, paper gap and photo remain readable.</text>
    <text class="meta" x="0" y="240">RISK  If the field reads as a decorative masthead or high-color photos swallow its edge, Chromatic recognition fails.</text>
  </g>
  <line class="divider" x1="55" y1="430" x2="1605" y2="430"/>

  <!-- Four Beat -->
  <g transform="translate(55 488)">
    <text class="h2" x="0" y="0">02 · FOUR BEAT</text><text class="meta" x="168" y="0">chromatic-four-beat-v1 · PAGE · RHYTHMIC · EXACTLY 4 · A1→A2→A3→A1</text>
    <g transform="translate(0 38)"><text class="state" y="-10">IDEAL COLOR-ON / MAX 4</text><use href="#beat-on"/><text class="tiny" x="0" y="137">physical 9:16 · 5.88% each · 01–04 cue</text></g>
    <g transform="translate(245 38)"><text class="state" y="-10">EXACT COLOR-OFF</text><use href="#beat-off"/><text class="tiny" x="0" y="137">dark → mid → light → dark</text></g>
    <g transform="translate(490 38)"><text class="state" y="-10">3:2 LANDSCAPE — RISK</text><rect class="paper" width="90" height="120"/><use href="#land" x="4.5" y="26.4" width="18.9" height="33.6"/><use href="#land" x="25.2" y="26.4" width="18.9" height="33.6"/><use href="#land" x="45.9" y="26.4" width="18.9" height="33.6"/><use href="#land" x="66.6" y="26.4" width="18.9" height="33.6"/><rect class="a1" x="4.5" y="67.2" width="18.9" height="19.2"/><rect class="a2" x="25.2" y="67.2" width="18.9" height="19.2"/><rect class="a3" x="45.9" y="67.2" width="18.9" height="19.2"/><rect class="a1" x="66.6" y="67.2" width="18.9" height="19.2"/><text class="idx inv" x="7.2" y="78">01</text><text class="idx inv" x="27.9" y="78">02</text><text class="idx ink" x="48.6" y="78">03</text><text class="idx inv" x="69.3" y="78">04</text><text class="tiny" x="0" y="137">62.50% source-area loss · focus each</text></g>
    <g transform="translate(735 38)"><text class="state" y="-10">4:5 PORTRAIT / SQUARE</text><use href="#beat-on"/><text class="tiny" x="0" y="137">loss 29.69% / 43.75%</text></g>
    <g transform="translate(980 38)"><text class="state" y="-10">HIGH-COLOR + CONTRAST</text><rect class="paper" width="90" height="120"/><use href="#busy" x="4.5" y="26.4" width="18.9" height="33.6"/><use href="#busy" x="25.2" y="26.4" width="18.9" height="33.6"/><use href="#busy" x="45.9" y="26.4" width="18.9" height="33.6"/><use href="#busy" x="66.6" y="26.4" width="18.9" height="33.6"/><rect class="a1" x="4.5" y="67.2" width="18.9" height="19.2"/><rect class="a2" x="25.2" y="67.2" width="18.9" height="19.2"/><rect class="a3" x="45.9" y="67.2" width="18.9" height="19.2"/><rect class="a1" x="66.6" y="67.2" width="18.9" height="19.2"/><text class="idx inv" x="7.2" y="78">01</text><text class="idx inv" x="27.9" y="78">02</text><text class="idx ink" x="48.6" y="78">03</text><text class="idx inv" x="69.3" y="78">04</text><text class="tiny" x="0" y="137">8.68 / 6.24 / 7.07 / 8.68</text></g>
    <g transform="translate(1260 38)"><text class="state" y="-10">MIN 4 / #05 OVERFLOW / NO NOTE</text><use href="#beat-on"/><rect class="reject" x="101" y="48" width="38" height="28"/><text class="rejectText" x="111" y="65">#05</text><path d="M103 50L137 74M137 50L103 74" stroke="#55585D"/><text class="tiny" x="0" y="137">page focus complete · no reflow</text></g>
    <text class="meta" x="0" y="218">COLOR-BLIND-INDEPENDENT  Physical order and literal 01–04 preserve identity; hue is never the only photo key.</text>
    <text class="meta" x="0" y="240">RISK  5.88% photographs and xs indices require real Reader Gate; 3:2 is heavy-crop content, not a general fit.</text>
  </g>
  <line class="divider" x1="55" y1="806" x2="1605" y2="806"/>

  <!-- Cross-field Note -->
  <g transform="translate(55 864)">
    <text class="h2" x="0" y="0">03 · CROSS-FIELD NOTE</text><text class="meta" x="235" y="0">chromatic-cross-field-note-v1 · SPREAD · ZONED · 1 PHOTO + REQUIRED NOTE · CROSS-PAGE-PAIR</text>
    <g transform="translate(0 38)"><text class="state" y="-10">IDEAL COLOR-ON / FULL SPREAD</text><use href="#cross-on"/><text class="tiny" x="0" y="137">Color Fields do not cross gutter</text></g>
    <g transform="translate(245 38)"><text class="state" y="-10">EXACT COLOR-OFF / SAME EVIDENCE</text><use href="#cross-off"/><text class="tiny" x="0" y="137">relation—not color—proves spread</text></g>
    <g transform="translate(490 38)"><text class="state" y="-10">LANDSCAPE / HIGH-COLOR PHOTO</text><rect class="paper" width="180" height="120"/><line class="gutter" x1="90" y1="0" x2="90" y2="120"/><use href="#busy" x="5.4" y="12" width="73.8" height="81.6"/><rect class="a3" x="5.4" y="98.4" width="73.8" height="14.4"/><text class="idx ink" x="9" y="107">IMAGE 01</text><rect class="a1" x="97.2" y="12" width="75.6" height="86.4"/><text class="idx inv" x="104" y="27">FIELD NOTE</text><text class="noteText inv" x="104" y="44">A required observation</text><text class="noteText inv" x="104" y="53">travels with this image.</text><text class="tiny" x="0" y="137">paper boundary must survive hue clash</text></g>
    <g transform="translate(735 38)"><text class="state" y="-10">PORTRAIT / SUBJECT-EDGE</text><rect class="paper" width="180" height="120"/><line class="gutter" x1="90" y1="0" x2="90" y2="120"/><use href="#portrait" x="5.4" y="12" width="73.8" height="81.6"/><rect class="safe" x="48" y="28" width="18" height="28"/><rect class="a3" x="5.4" y="98.4" width="73.8" height="14.4"/><text class="idx ink" x="9" y="107">IMAGE 01</text><rect class="a1" x="97.2" y="12" width="75.6" height="86.4"/><text class="idx inv" x="104" y="27">FIELD NOTE</text><text class="noteText inv" x="104" y="44">A required observation</text><text class="noteText inv" x="104" y="53">travels with this image.</text><text class="tiny" x="0" y="137">focus can move one subject, not two ends</text></g>
    <g transform="translate(980 38)"><text class="state" y="-10">EMPTY REJECT / 1–11 + 12 LEGAL</text><rect class="paper" width="180" height="120"/><line class="gutter" x1="90" y1="0" x2="90" y2="120"/><use href="#land" x="5.4" y="12" width="73.8" height="81.6"/><rect class="a3" x="5.4" y="98.4" width="73.8" height="14.4"/><text class="idx ink" x="9" y="107">IMAGE 01</text><rect class="a1" x="97.2" y="12" width="75.6" height="86.4"/><text class="idx inv" x="104" y="27">FIELD NOTE</text><text class="noteText inv" x="104" y="44">EMPTY — REJECT</text><text class="noteText inv" x="104" y="58">Short note — 10 legal</text><text class="noteText inv" x="104" y="72">Twelve chars — target</text><text class="tiny" x="0" y="137">all use one fixed field; only empty is incompatible</text></g>
    <g transform="translate(1260 38)"><text class="state" y="-10">LONGEST 90 / LEFT + RIGHT FOCUS</text><rect class="paper" width="180" height="120"/><line class="gutter" x1="90" y1="0" x2="90" y2="120"/><use href="#land" x="5.4" y="12" width="73.8" height="81.6"/><rect class="a3" x="5.4" y="98.4" width="73.8" height="14.4"/><text class="idx ink" x="9" y="107">IMAGE 01</text><rect class="a1" x="97.2" y="12" width="75.6" height="86.4"/><text class="idx inv" x="104" y="27">FIELD NOTE</text><text class="noteText inv" x="104" y="42" style="font-size:5px">Longest note stays.</text><text class="noteText inv" x="104" y="50" style="font-size:5px">within four fixed lines;</text><text class="noteText inv" x="104" y="58" style="font-size:5px">field and source photo</text><text class="noteText inv" x="104" y="66" style="font-size:5px">do not move or resize.</text><text class="tiny" x="0" y="137">LEFT source complete · RIGHT destination complete</text></g>
    <text class="meta" x="0" y="218">CONTRAST  IMAGE 01 ink/A3 = 7.07:1 · FIELD NOTE and Note inverse/A1 = 8.68:1. Required Note uses fixed geometry.</text>
    <text class="meta" x="0" y="240">EVIDENCE  Only Photo→Note cross-page-pair. Color Fields are page-side-contained and never create the spread.</text>
  </g>

  <line class="divider" x1="55" y1="1182" x2="1605" y2="1182"/>
  <text class="h2" x="55" y="1232">PAIRWISE / TOPOLOGY COLLISION</text>
  <text class="meta" x="55" y="1262">ENTRY ↔ FOUR BEAT = 10 · ENTRY ↔ CROSS-FIELD = 12 · FOUR BEAT ↔ CROSS-FIELD = 13 · all ≥4.</text>
  <text class="meta" x="55" y="1286">Neutralize all accents: one threshold + one photo ≠ four indexed beats ≠ left source / right required Note spread. No collision.</text>
  <text class="h2" x="55" y="1338">CROSS-FAMILY BOUNDARY</text>
  <text class="meta" x="55" y="1368">QUIET — fields perform entry/source/destination, not atmosphere. EDITORIAL — no title-led selected anchor; required Note is Photo-bound, not body copy.</text>
  <text class="meta" x="55" y="1392">GRID — Four Beat’s color rule is first, with index as secondary cue. DYNAMIC — no active bleed, scale jump or action sweep.</text>
  <text class="h2" x="55" y="1444">USER VISUAL GATE</text>
  <text class="meta" x="55" y="1474">1  Is Entry Field’s 16.2% blue threshold structural, not a decorative masthead?</text>
  <text class="meta" x="55" y="1498">2  Are Four Beat’s 5.88% photos / xs indices legible, and does physical 9:16 stay mature with busy photography?</text>
  <text class="meta" x="55" y="1522">3  Does Cross-field Note’s 60.48% right field work at 1–11, 12 and 90 characters, including both page-focus views?</text>
  <text class="meta" x="55" y="1546">4  Should any accent be desaturated after real photo/print testing while preserving every ≥4.5:1 text pairing?</text>
  <rect class="dark" x="55" y="1590" width="1550" height="118"/>
  <text class="state white" x="80" y="1624">AUDIT LAYER ONLY</text>
  <text class="meta white" x="80" y="1650">State labels, contrast numbers, safe/focus boxes, binding lines, rejection marks and Color-off simulations are documentation—not Renderer assets.</text>
  <text class="meta white" x="80" y="1676">All Color Fields are solid opaque rectangles at z 0; photos cover at z 10; text uses z 20 and one deterministic surface.</text>
  <text class="tiny" x="55" y="1765">Original vector photographic placeholders only. No source photography, fonts, textures, gradients, opacity, filters or blend modes are used.</text>
</svg>
