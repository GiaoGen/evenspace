<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Quiet family five-candidate grayscale concept board</title>
  <desc id="desc">Five anonymous Quiet layout candidates Q-A through Q-E shown at a common physical scale. Q-A to Q-D are three-to-four pages and Q-E is a three-to-two spread.</desc>
  <defs>
    <pattern id="landscape" patternUnits="objectBoundingBox" width="1" height="1" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <rect width="100" height="100" fill="#c8c8c8"/>
      <path d="M0 66L18 46L34 61L55 32L78 58L100 42V100H0Z" fill="#777"/>
      <path d="M0 74L25 61L45 70L67 52L100 67V100H0Z" fill="#9b9b9b"/>
      <circle cx="73" cy="25" r="7" fill="#ededed"/>
      <circle cx="34" cy="55" r="3.5" fill="#333"/>
    </pattern>
    <pattern id="portrait" patternUnits="objectBoundingBox" width="1" height="1" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <rect width="100" height="100" fill="#bdbdbd"/>
      <rect x="12" y="12" width="76" height="76" fill="#d7d7d7"/>
      <circle cx="58" cy="38" r="14" fill="#555"/>
      <path d="M34 87C36 63 46 51 59 51C73 51 82 65 84 87Z" fill="#696969"/>
      <path d="M8 18H32V100H8Z" fill="#969696"/>
    </pattern>
    <pattern id="detail" patternUnits="objectBoundingBox" width="1" height="1" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <rect width="100" height="100" fill="#d5d5d5"/>
      <ellipse cx="61" cy="47" rx="31" ry="20" fill="#777"/>
      <ellipse cx="58" cy="43" rx="17" ry="10" fill="#aeaeae"/>
      <path d="M0 82C25 58 48 92 100 62V100H0Z" fill="#979797"/>
      <circle cx="61" cy="46" r="3" fill="#222"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#222"/></marker>
    <style>
      .board{fill:#f3f3f1}.page{fill:#fff;stroke:#222;stroke-width:2}.safe{fill:none;stroke:#aaa;stroke-width:1;stroke-dasharray:5 5}.gutter{fill:#dedede}.label{font:700 24px Arial,sans-serif;fill:#111}.meta{font:14px Arial,sans-serif;fill:#333}.small{font:12px Arial,sans-serif;fill:#555}.path{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.note{stroke:#333;stroke-width:1.5}.noteText{font:10px Arial,sans-serif;fill:#222}.photo{stroke:#222;stroke-width:1.5}.axis{stroke:#777;stroke-width:1;stroke-dasharray:3 3}.statusKeep{font:700 12px Arial,sans-serif;fill:#111}.statusDrop{font:12px Arial,sans-serif;fill:#666}.rule{stroke:#bbb;stroke-width:1}
    </style>
  </defs>
  <rect class="board" width="1600" height="980"/>
  <text x="70" y="66" class="label">QUIET / COLORLESS STRUCTURE TEST</text>
  <text x="70" y="94" class="meta">Common scale: one page = 180 × 240 · page 3:4 · spread 3:2 · photography is self-made grayscale placeholder</text>
  <line x1="70" y1="118" x2="1530" y2="118" class="rule"/>

  <!-- Q-A -->
  <g transform="translate(70 170)">
    <text x="90" y="-24" text-anchor="middle" class="label">Q-A</text>
    <rect class="page" width="180" height="240"/>
    <rect class="safe" x="18" y="24" width="144" height="192"/>
    <line class="axis" x1="90" y1="20" x2="90" y2="220"/>
    <rect class="photo" x="25.2" y="38.4" width="129.6" height="144" fill="url(#portrait)"/>
    <circle cx="101" cy="93" r="4" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path class="path" d="M90 72V145"/>
    <text x="0" y="272" class="meta">PAGE · 1 PHOTO</text>
    <text x="0" y="294" class="small">path 1: image → hold → paper</text>
    <text x="0" y="316" class="statusKeep">SHORTLIST</text>
  </g>

  <!-- Q-B -->
  <g transform="translate(330 170)">
    <text x="90" y="-24" text-anchor="middle" class="label">Q-B</text>
    <rect class="page" width="180" height="240"/>
    <rect class="gutter" x="0" y="0" width="7" height="240"/>
    <rect class="safe" x="25" y="24" width="137" height="192"/>
    <line class="axis" x1="126" y1="20" x2="126" y2="220"/>
    <rect class="photo" x="59" y="39" width="96" height="137" fill="url(#landscape)"/>
    <line class="note" x1="59" y1="192" x2="114" y2="192"/>
    <text class="noteText" x="59" y="207">1  PHOTO NOTE</text>
    <path class="path" d="M123 74C145 122 113 160 72 191"/>
    <text x="0" y="272" class="meta">PAGE · 1 PHOTO</text>
    <text x="0" y="294" class="small">path 1: outer edge → image → note</text>
    <text x="0" y="316" class="statusDrop">ELIMINATE</text>
  </g>

  <!-- Q-C -->
  <g transform="translate(590 170)">
    <text x="90" y="-24" text-anchor="middle" class="label">Q-C</text>
    <rect class="page" width="180" height="240"/>
    <rect class="safe" x="18" y="24" width="144" height="192"/>
    <line class="axis" x1="18" y1="22" x2="162" y2="218"/>
    <rect class="photo" x="18" y="31.2" width="108" height="96" fill="url(#landscape)"/>
    <rect class="photo" x="93.6" y="144" width="68.4" height="76.8" fill="url(#detail)"/>
    <line class="note" x1="18" y1="184" x2="68" y2="184"/>
    <text class="noteText" x="18" y="199">2  OPTIONAL NOTE</text>
    <path class="path" d="M48 67C91 104 109 137 126 170"/>
    <text x="0" y="272" class="meta">PAGE · 2 PHOTOS</text>
    <text x="0" y="294" class="small">path 1→2→note · warm 2:1 scale echo</text>
    <text x="0" y="316" class="statusKeep">SHORTLIST</text>
  </g>

  <!-- Q-D -->
  <g transform="translate(850 170)">
    <text x="90" y="-24" text-anchor="middle" class="label">Q-D</text>
    <rect class="page" width="180" height="240"/>
    <rect class="safe" x="22" y="24" width="136" height="192"/>
    <line class="axis" x1="90" y1="20" x2="90" y2="220"/>
    <rect class="photo" x="32" y="33" width="98" height="39" fill="url(#landscape)"/>
    <rect class="photo" x="50" y="100" width="98" height="39" fill="url(#portrait)"/>
    <rect class="photo" x="27" y="168" width="98" height="39" fill="url(#detail)"/>
    <path class="path" d="M81 54C115 82 115 110 99 120C69 141 71 170 78 187"/>
    <text x="0" y="272" class="meta">PAGE · 3 PHOTOS</text>
    <text x="0" y="294" class="small">path 1→2→3 · three measured pauses</text>
    <text x="0" y="316" class="statusDrop">ELIMINATE</text>
  </g>

  <!-- Q-E, same physical page scale -->
  <g transform="translate(1110 170)">
    <text x="180" y="-24" text-anchor="middle" class="label">Q-E</text>
    <rect class="page" width="360" height="240"/>
    <rect class="safe" x="18" y="24" width="324" height="192"/>
    <rect class="gutter" x="176.5" y="0" width="7" height="240"/>
    <rect class="photo" x="50.4" y="40.8" width="259.2" height="158.4" fill="url(#landscape)"/>
    <line x1="180" y1="40.8" x2="180" y2="199.2" stroke="#fff" stroke-width="1" opacity=".7"/>
    <circle cx="122" cy="111" r="5" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path class="path" d="M95 116H266"/>
    <text x="0" y="272" class="meta">SPREAD · 1 PHOTO · CROSS-GUTTER EVIDENCE</text>
    <text x="0" y="294" class="small">path 1: left field → gutter → right field</text>
    <text x="0" y="316" class="statusKeep">SHORTLIST</text>
  </g>

  <line x1="70" y1="560" x2="1530" y2="560" class="rule"/>
  <text x="70" y="604" class="label">FAIR-COMPARISON KEY</text>
  <g transform="translate(70 640)">
    <rect x="0" y="0" width="58" height="44" fill="url(#landscape)" stroke="#222"/>
    <text x="78" y="18" class="meta">photo frame — always cover-filled</text>
    <text x="78" y="39" class="small">internal shapes show subject position and crop sensitivity</text>
    <rect x="510" y="0" width="58" height="44" fill="#fff" stroke="#222"/>
    <text x="588" y="18" class="meta">paper / continuous negative space</text>
    <text x="588" y="39" class="small">not an unfilled photo frame or a future content slot</text>
    <line x1="1030" y1="9" x2="1088" y2="9" class="note"/>
    <text x="1030" y="30" class="noteText">1  NOTE</text>
    <text x="1110" y="18" class="meta">Photo Note binding</text>
    <text x="1110" y="39" class="small">number + line; never a card</text>
  </g>
  <g transform="translate(70 748)">
    <text x="0" y="0" class="meta">Q-A  large framed single / center hold</text>
    <text x="0" y="28" class="meta">Q-B  outward-weighted single / spine avoidance</text>
    <text x="0" y="56" class="meta">Q-C  warm-scale diptych / diagonal echo</text>
    <text x="520" y="0" class="meta">Q-D  three-image slow sequence / vertical pauses</text>
    <text x="520" y="28" class="meta">Q-E  one cross-gutter landscape / horizontal immersion</text>
    <text x="520" y="56" class="small">Names remain hidden here; only Q-A…Q-E are used for the concept decision.</text>
  </g>
  <text x="70" y="908" class="small">Gray dashed rectangles are safe-area guides, not rendered decoration. Gray gutter bands are physical risk zones, not color fields.</text>
  <text x="70" y="936" class="small">Decision: retain Q-A / Q-C / Q-E. Eliminate Q-B / Q-D before naming and full Anchor expansion.</text>
</svg>
