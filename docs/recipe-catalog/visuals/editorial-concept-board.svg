<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="620" viewBox="0 0 1580 620" role="img" aria-labelledby="title desc">
  <title id="title">Editorial Family F3-A2 — five grayscale topology candidates</title>
  <desc id="desc">A fair-scale comparison of four three-to-four pages and one three-to-two spread, labelled E-A through E-E. Photography is represented by original grayscale scene diagrams.</desc>
  <defs>
    <style>
      .bg{fill:#e7e7e4}.paper{fill:#fff;stroke:#171717;stroke-width:1.5}.photo{stroke:#171717;stroke-width:1.2}.ink{fill:#171717}.mid{fill:#777}.light{fill:#c8c8c5}.ghost{fill:none;stroke:#888;stroke-width:1;stroke-dasharray:4 4}.bind{fill:none;stroke:#222;stroke-width:1}.path{fill:none;stroke:#111;stroke-width:1.3;marker-end:url(#arrow)}.spine{stroke:#111;stroke-width:1.2;stroke-dasharray:5 4}.label{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#111}.meta{font:12px Arial,sans-serif;fill:#333}.small{font:10px Arial,sans-serif;fill:#444}.tiny{font:8px Arial,sans-serif;fill:#444}.titlebar{fill:#111}.deckbar{fill:#7b7b7b}.notebar{fill:#555}.num{font:700 9px Arial,sans-serif;fill:#fff}.caption{font:700 12px Arial,sans-serif;fill:#111}.drop{font:11px Arial,sans-serif;fill:#666}.keep{fill:#222}.dropfill{fill:#777}.frameLabel{font:700 9px Arial,sans-serif;fill:#fff}.risk{fill:none;stroke:#fff;stroke-width:1;stroke-dasharray:3 3}
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker>
    <symbol id="scene-land" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#9b9b98"/><rect y="58" width="100" height="42" fill="#555"/><path d="M0 61L23 36L42 58L67 25L100 62Z" fill="#777"/><circle cx="73" cy="38" r="8" fill="#d8d8d5"/><rect x="18" y="44" width="12" height="27" rx="5" fill="#292929"/><circle cx="24" cy="39" r="6" fill="#292929"/>
    </symbol>
    <symbol id="scene-port" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#b4b4b1"/><rect x="12" width="24" height="100" fill="#858582"/><rect x="68" width="19" height="100" fill="#d5d5d2"/><ellipse cx="53" cy="42" rx="18" ry="23" fill="#424242"/><path d="M28 100Q34 64 53 63Q75 66 82 100Z" fill="#686865"/><circle cx="47" cy="39" r="2" fill="#ddd"/><circle cx="59" cy="39" r="2" fill="#ddd"/>
    </symbol>
    <symbol id="scene-detail" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#696966"/><path d="M-10 87L28 13L49 21L15 100Z" fill="#bdbdba"/><circle cx="70" cy="34" r="19" fill="#303030"/><circle cx="70" cy="34" r="7" fill="#d7d7d4"/><path d="M48 100L90 61L108 83L87 100Z" fill="#92928f"/>
    </symbol>
  </defs>
  <rect class="bg" width="1580" height="620"/>
  <text x="70" y="45" class="label">EDITORIAL / F3-A2 / CONCEPT GATE</text>
  <text x="70" y="70" class="meta">Color removed. One display scale: page 180×240 (3:4), spread 360×240 (3:2). Arrows and binding lines are design-review overlays only.</text>

  <!-- E-A: role 01 -->
  <g transform="translate(55 125)">
    <text x="0" y="-18" class="label">E-A</text><text x="52" y="-18" class="meta">PAGE · 1 PHOTO · NOTE NONE</text>
    <rect class="paper" width="180" height="240"/>
    <rect class="titlebar" x="14" y="18" width="144" height="10"/><rect class="titlebar" x="14" y="32" width="108" height="10"/>
    <rect class="deckbar" x="14" y="52" width="92" height="4"/><rect class="deckbar" x="14" y="59" width="77" height="4"/>
    <svg x="14" y="82" width="152" height="139" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><use href="#scene-land"/></svg><rect class="photo" fill="none" x="14" y="82" width="152" height="139"/>
    <text x="19" y="96" class="frameLabel">MAIN 01</text>
    <path class="path" d="M158 25C173 44 171 69 157 85"/>
    <text x="14" y="233" class="tiny">title → deck → main</text>
  </g>

  <!-- E-B: role 02 -->
  <g transform="translate(310 125)">
    <text x="0" y="-18" class="label">E-B</text><text x="52" y="-18" class="meta">PAGE · 1 PHOTO · REQUIRED CAPTION</text>
    <rect class="paper" width="180" height="240"/>
    <svg x="14" y="23" width="152" height="154" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><use href="#scene-port"/></svg><rect class="photo" fill="none" x="14" y="23" width="152" height="154"/>
    <circle cx="23" cy="168" r="7" class="ink"/><text x="20" y="171" class="num">1</text>
    <rect class="notebar" x="14" y="192" width="96" height="4"/><rect class="notebar" x="14" y="199" width="121" height="4"/><rect class="notebar" x="14" y="206" width="72" height="4"/>
    <path class="bind" d="M23 176L23 189"/><path class="path" d="M156 83C174 113 168 167 126 194"/>
    <text x="14" y="230" class="tiny">main 01 → caption 01</text>
  </g>

  <!-- E-C: role 03 -->
  <g transform="translate(565 125)">
    <text x="0" y="-32" class="label">E-C</text><text x="52" y="-32" class="meta" textLength="105" lengthAdjust="spacingAndGlyphs">PAGE · 2 PHOTOS</text>
    <text x="0" y="-12" class="small" textLength="210" lengthAdjust="spacingAndGlyphs">OPTIONAL NOTE · main → evidence → note</text>
    <rect class="paper" width="180" height="240"/>
    <svg x="13" y="31" width="112" height="151" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><use href="#scene-land"/></svg><rect class="photo" fill="none" x="13" y="31" width="112" height="151"/>
    <text x="18" y="45" class="frameLabel">MAIN 01</text>
    <rect class="ink" x="130" y="19" width="34" height="4"/><rect class="notebar" x="130" y="38" width="32" height="3"/><rect class="notebar" x="130" y="44" width="27" height="3"/><rect class="notebar" x="130" y="50" width="34" height="3"/><rect class="notebar" x="130" y="56" width="23" height="3"/>
    <svg x="130" y="113" width="35" height="89" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><use href="#scene-detail"/></svg><rect class="photo" fill="none" x="130" y="113" width="35" height="89"/>
    <circle cx="138" cy="191" r="6" class="ink"/><text x="135" y="194" class="num">2</text><path class="bind" d="M138 185L138 62"/>
    <path class="path" d="M78 65C117 73 121 119 143 131"/><text x="13" y="229" class="tiny">main → evidence 02 → note 02</text>
  </g>

  <!-- E-D: role 06 -->
  <g transform="translate(820 125)">
    <text x="0" y="-32" class="label">E-D</text><text x="52" y="-32" class="meta" textLength="105" lengthAdjust="spacingAndGlyphs">PAGE · 4 PHOTOS</text>
    <text x="0" y="-12" class="small" textLength="180" lengthAdjust="spacingAndGlyphs">NOTE REQUIRED · INDEXED PATH</text>
    <rect class="paper" width="180" height="240"/>
    <rect class="titlebar" x="14" y="17" width="88" height="7"/><rect class="deckbar" x="14" y="30" width="126" height="3"/>
    <svg x="14" y="48" width="94" height="86" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><use href="#scene-land"/></svg><rect class="photo" fill="none" x="14" y="48" width="94" height="86"/>
    <svg x="114" y="48" width="52" height="48" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><use href="#scene-detail"/></svg><rect class="photo" fill="none" x="114" y="48" width="52" height="48"/>
    <svg x="14" y="140" width="52" height="48" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><use href="#scene-port"/></svg><rect class="photo" fill="none" x="14" y="140" width="52" height="48"/>
    <svg x="72" y="140" width="52" height="48" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><use href="#scene-detail"/></svg><rect class="photo" fill="none" x="72" y="140" width="52" height="48"/>
    <g><circle cx="101" cy="127" r="6" class="ink"/><text x="98" y="130" class="num">1</text><circle cx="159" cy="89" r="6" class="ink"/><text x="156" y="92" class="num">2</text><circle cx="59" cy="181" r="6" class="ink"/><text x="56" y="184" class="num">3</text><circle cx="117" cy="181" r="6" class="ink"/><text x="114" y="184" class="num">4</text></g>
    <rect class="notebar" x="132" y="140" width="34" height="3"/><rect class="notebar" x="132" y="148" width="29" height="3"/><rect class="notebar" x="132" y="156" width="34" height="3"/><rect class="notebar" x="132" y="164" width="25" height="3"/>
    <path class="path" d="M56 91C87 101 129 92 140 72M140 72C130 135 87 164 38 163"/>
    <text x="14" y="229" class="tiny">thesis → 1 → 2 → 3 → 4 / index</text>
  </g>

  <!-- E-E: role 11 legal spread -->
  <g transform="translate(1075 125)">
    <text x="0" y="-32" class="label">E-E</text><text x="52" y="-32" class="meta" textLength="110" lengthAdjust="spacingAndGlyphs">SPREAD · 1 PHOTO</text>
    <text x="0" y="-12" class="small" textLength="200" lengthAdjust="spacingAndGlyphs">REQUIRED NOTE · CROSS-PAGE PAIR</text>
    <rect class="paper" width="360" height="240"/>
    <svg x="14" y="19" width="151" height="202" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><use href="#scene-port"/></svg><rect class="photo" fill="none" x="14" y="19" width="151" height="202"/>
    <circle cx="153" cy="210" r="7" class="ink"/><text x="150" y="213" class="num">1</text>
    <line class="spine" x1="180" y1="0" x2="180" y2="240"/><text x="184" y="232" class="tiny">SPINE</text>
    <rect class="ink" x="207" y="31" width="42" height="4"/>
    <rect class="notebar" x="207" y="68" width="106" height="5"/><rect class="notebar" x="207" y="78" width="124" height="5"/><rect class="notebar" x="207" y="88" width="115" height="5"/><rect class="notebar" x="207" y="98" width="89" height="5"/><rect class="notebar" x="207" y="108" width="120" height="5"/><rect class="notebar" x="207" y="118" width="72" height="5"/>
    <circle cx="213" cy="61" r="7" class="ink"/><text x="210" y="64" class="num">1</text><path class="bind" d="M160 210C189 202 199 141 213 68"/>
    <path class="path" d="M88 91C150 54 208 51 256 74"/>
    <text x="207" y="151" class="tiny">PHOTO 01 → GUTTER → NOTE 01</text>
    <text x="207" y="229" class="tiny">evidence: required Photo–Note cross-page-pair</text>
  </g>

  <g transform="translate(55 420)">
    <text class="caption" x="0" y="0">STRUCTURAL COMPARISON</text>
    <text class="meta" x="0" y="27">E-A — title/deck owns the entry; one main photograph answers it. Strong family recognition, low photo-count range.</text>
    <text class="meta" x="0" y="51">E-B — a clear fact page, but too close to E-A once caption pressure is removed; weakest batch-level difference.</text>
    <text class="meta" x="0" y="75">E-C — asymmetric main/evidence roles plus a fixed context lane. Note 02 binds only to evidence 02; survives when absent.</text>
    <text class="meta" x="0" y="99">E-D — index is legible, but four similarly sized modules pull it toward Grid/Contact and dilute a single first entry.</text>
    <text class="meta" x="0" y="123">E-E — legal spread: the photograph stays on the left; required Note 01 on the right creates the cross-page evidence.</text>
    <rect class="keep" x="1040" y="14" width="14" height="14"/><text class="meta" x="1062" y="26">KEEP: E-A / E-C / E-E</text>
    <rect class="dropfill" x="1040" y="46" width="14" height="14"/><text class="meta" x="1062" y="58">DROP: E-B / E-D</text>
    <text class="small" x="1040" y="92">Photo frames are always cover-filled.</text>
    <text class="small" x="1040" y="109">Gray scenes are original placeholders.</text>
    <text class="small" x="1040" y="126">No color, overlap, rotation or reflow.</text>
  </g>
</svg>
