name: Backend schema

on:
  pull_request:
    paths:
      - ".github/workflows/backend-schema.yml"
      - "data/supabase/database.types.ts"
      - "scripts/check-supabase-schema-drift.mjs"
      - "scripts/supabase-types.mjs"
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Link cloud development project
        run: >-
          npx supabase --agent no link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$SUPABASE_DB_PASSWORD"

      - name: Verify migration history
        run: npm run supabase:migrations

      - name: Preview pending migrations
        run: npm run supabase:push:check

      - name: Verify schema drift
        run: npm run supabase:diff:check

      - name: Run cloud database integration tests
        run: npm run supabase:test:db

      - name: Verify generated database types
        run: npm run supabase:types:check
